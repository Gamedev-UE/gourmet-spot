<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Reviews / 飲食店口コミ</title>
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; }
        header { background-color: var(--dark); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-tools { display: flex; gap: 10px; align-items: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .restaurant-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background-color: #eee; }
        .map-btn { display: inline-block; width: 100%; text-align: center; background-color: #3498db; color: white; padding: 10px; margin-top: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; box-sizing: border-box; }
        .map-btn:hover { background-color: #2980b9; }
        .badge { background: #e67e22; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <h2>🍔 GourmetSpot</h2>
    <div class="nav-tools">
        <select id="langSelect" onchange="changeLanguage()" style="width: auto;">
            <option value="uz">O'zbekcha</option>
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
        </select>
        <span id="userInfo"></span>
        <button id="authBtn" onclick="toggleAuth()" style="width: auto;">Kirish</button>
    </div>
</header>

<div class="container">
    <!-- Search Section -->
    <div class="card">
        <input type="text" id="searchInput" placeholder="Restoranni qidirish..." oninput="renderRestaurants()">
    </div>

    <!-- Admin / Add Restaurant Section -->
    <div class="card" id="addRestaurantForm">
        <h3 id="lblAddTitle">Yangi Restoran Qo'shish</h3>
        <input type="text" id="resName" placeholder="Restoran nomi">
        <input type="text" id="resCuisine" placeholder="Oshxona turi (masalan: Yapon, Uzbek)">
        <input type="text" id="resImg" placeholder="Rasm URL (Rasm ustida o'ng tugma -> Copy Image Address)">
        <input type="text" id="resMapUrl" placeholder="Xarita havolasi (Google Maps yoki Yandex Maps linki)">
        <button onclick="saveRestaurant()" id="btnSaveRes">Saqlash</button>
    </div>

    <!-- Restaurant List -->
    <div class="grid" id="restaurantList"></div>
</div>

<script>
    const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&auto=format&fit=crop";

    let currentUser = JSON.parse(localStorage.getItem('user')) || null;
    let restaurants = JSON.parse(localStorage.getItem('restaurants')) || [];
    
    // Sakura Sushi bazada qolgan bo'lsa, uni avtomatik tozalab yuborish
    restaurants = restaurants.filter(r => r.name !== "Sakura Sushi");
    localStorage.setItem('restaurants', JSON.stringify(restaurants));

    let currentLang = 'uz';

    const i18n = {
        uz: { 
            search: "Restoranni qidirish...", 
            addTitle: "Yangi Restoran Qo'shish", 
            save: "Saqlash", 
            login: "Kirish", 
            logout: "Chiqish", 
            review: "Sharh qoldirish...", 
            addReview: "Yuborish",
            delete: "O'chirish",
            reviewsTitle: "Sharhlar:",
            noReviews: "Hali sharhlar yo'q",
            namePlaceholder: "Restoran nomi",
            cuisinePlaceholder: "Oshxona turi (masalan: Yapon, Uzbek)",
            imgPlaceholder: "Rasm URL havolasi",
            mapPlaceholder: "Xarita havolasi (Google Maps linki)",
            viewMap: "📍 Xaritada ko'rish",
            promptName: "Ismingizni kiriting:",
            alertLogin: "Avval tizimga kiring!",
            alertName: "Restoran nomini kiriting!"
        },
        ja: { 
            search: "店舗を検索...", 
            addTitle: "新しい飲食店を登録", 
            save: "保存", 
            login: "ログイン", 
            logout: "ログアウト", 
            review: "口コミを書く...", 
            addReview: "送信",
            delete: "削除",
            reviewsTitle: "口コミ・評価:",
            noReviews: "まだ口コミがありません",
            namePlaceholder: "店名",
            cuisinePlaceholder: "料理ジャンル（例：和食、ウズベク料理）",
            imgPlaceholder: "画像URL",
            mapPlaceholder: "地図URL（Google Mapリンク）",
            viewMap: "📍 地図で見る",
            promptName: "お名前を入力してください:",
            alertLogin: "最初にログインしてください！",
            alertName: "店名を入力してください！"
        },
        en: { 
            search: "Search restaurant...", 
            addTitle: "Add New Restaurant", 
            save: "Save", 
            login: "Login", 
            logout: "Logout", 
            review: "Write Review...", 
            addReview: "Submit",
            delete: "Delete",
            reviewsTitle: "Reviews:",
            noReviews: "No reviews yet",
            namePlaceholder: "Restaurant Name",
            cuisinePlaceholder: "Cuisine (e.g., Japanese, Uzbek)",
            imgPlaceholder: "Image URL",
            mapPlaceholder: "Location Link (Google Maps URL)",
            viewMap: "📍 View on Map",
            promptName: "Enter your name:",
            alertLogin: "Please login first!",
            alertName: "Please enter restaurant name!"
        },
        ru: { 
            search: "Поиск ресторана...", 
            addTitle: "Добавить новый ресторан", 
            save: "Сохранить", 
            login: "Войти", 
            logout: "Выйти", 
            review: "Оставить отзыв...", 
            addReview: "Отправить",
            delete: "Удалить",
            reviewsTitle: "Отзывы:",
            noReviews: "Отзывов пока нет",
            namePlaceholder: "Название ресторана",
            cuisinePlaceholder: "Кухня (например: Японская, Узбекская)",
            imgPlaceholder: "Ссылка на изображение",
            mapPlaceholder: "Ссылка на карту (Google Maps)",
            viewMap: "📍 Посмотреть на карте",
            promptName: "Введите ваше имя:",
            alertLogin: "Сначала войдите в систему!",
            alertName: "Введите название ресторана!"
        }
    };

    function init() {
        updateAuthUI();
        changeLanguage();
    }

    function changeLanguage() {
        currentLang = document.getElementById('langSelect').value;
        const langData = i18n[currentLang];

        document.getElementById('searchInput').placeholder = langData.search;
        document.getElementById('lblAddTitle').innerText = langData.addTitle;
        document.getElementById('btnSaveRes').innerText = langData.save;

        document.getElementById('resName').placeholder = langData.namePlaceholder;
        document.getElementById('resCuisine').placeholder = langData.cuisinePlaceholder;
        document.getElementById('resImg').placeholder = langData.imgPlaceholder;
        document.getElementById('resMapUrl').placeholder = langData.mapPlaceholder;

        updateAuthUI();
        renderRestaurants();
    }

    function toggleAuth() {
        if (currentUser) {
            currentUser = null;
            localStorage.removeItem('user');
        } else {
            const name = prompt(i18n[currentLang].promptName);
            if (name) {
                currentUser = { name: name, id: Date.now() };
                localStorage.setItem('user', JSON.stringify(currentUser));
            }
        }
        updateAuthUI();
    }

    function updateAuthUI() {
        const authBtn = document.getElementById('authBtn');
        const userInfo = document.getElementById('userInfo');
        if (currentUser) {
            authBtn.innerText = i18n[currentLang].logout;
            userInfo.innerText = `👤 ${currentUser.name}`;
        } else {
            authBtn.innerText = i18n[currentLang].login;
            userInfo.innerText = '';
        }
    }

    function saveRestaurant() {
        if (!currentUser) return alert(i18n[currentLang].alertLogin);
        const name = document.getElementById('resName').value;
        const cuisine = document.getElementById('resCuisine').value;
        const imgInput = document.getElementById('resImg').value.trim();
        const mapUrl = document.getElementById('resMapUrl').value.trim();
        const img = imgInput || DEFAULT_IMAGE;

        if (!name) return alert(i18n[currentLang].alertName);

        const newRes = { 
            id: Date.now(), 
            name, 
            cuisine, 
            img, 
            mapUrl: mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`, 
            reviews: [], 
            owner: currentUser.name 
        };

        restaurants.push(newRes);
        localStorage.setItem('restaurants', JSON.stringify(restaurants));

        document.getElementById('resName').value = '';
        document.getElementById('resCuisine').value = '';
        document.getElementById('resImg').value = '';
        document.getElementById('resMapUrl').value = '';

        renderRestaurants();
    }

    function deleteRestaurant(id) {
        restaurants = restaurants.filter(r => r.id !== id);
        localStorage.setItem('restaurants', JSON.stringify(restaurants));
        renderRestaurants();
    }

    function addReview(resId) {
        if (!currentUser) return alert(i18n[currentLang].alertLogin);
        const text = document.getElementById(`revInput-${resId}`).value;
        const rating = document.getElementById(`revRating-${resId}`).value;
        if (!text) return;

        const res = restaurants.find(r => r.id === resId);
        res.reviews.push({ user: currentUser.name, text, rating, date: new Date().toLocaleDateString() });
        localStorage.setItem('restaurants', JSON.stringify(restaurants));
        renderRestaurants();
    }

    function renderRestaurants() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const list = document.getElementById('restaurantList');
        const langData = i18n[currentLang];
        list.innerHTML = '';

        restaurants.filter(r => r.name.toLowerCase().includes(query)).forEach(res => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let reviewsHTML = res.reviews.map(rev => `<div><b>${rev.user}</b> (${rev.rating}⭐): ${rev.text}</div>`).join('');
            let isOwner = currentUser && currentUser.name === res.owner;

            card.innerHTML = `
                <img src="${res.img}" class="restaurant-img" onerror="this.onerror=null; this.src='${DEFAULT_IMAGE}';">
                <h3>${res.name} <span class="badge">${res.cuisine}</span></h3>
                ${isOwner ? `<button onclick="deleteRestaurant(${res.id})" style="background:red;">${langData.delete}</button>` : ''}
                <a href="${res.mapUrl}" target="_blank" class="map-btn">${langData.viewMap}</a>
                <h4>${langData.reviewsTitle}</h4>
                <div>${reviewsHTML || langData.noReviews}</div>
                <hr>
                <div>
                    <input type="text" id="revInput-${res.id}" placeholder="${langData.review}">
                    <select id="revRating-${res.id}">
                        <option value="5">5 ⭐</option>
                        <option value="4">4 ⭐</option>
                        <option value="3">3 ⭐</option>
                        <option value="2">2 ⭐</option>
                        <option value="1">1 ⭐</option>
                    </select>
                    <button onclick="addReview(${res.id})">${langData.addReview}</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    init();
</script>
</body>
</html>
